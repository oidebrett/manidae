  # Traefik reverse proxy for Hermes Agent web dashboard
  # Routes {HERMES_SUBDOMAIN}.{HERMES_DOMAIN} → host localhost:9119 (hermes dashboard)
  # The hermes dashboard runs as a systemd service on the host bound to 0.0.0.0:9119
  # (UFW blocks 9119 publicly); it authenticates users itself via Hermes' built-in
  # `basic` dashboard-auth provider, so Traefik just terminates TLS and reverse-proxies
  # (no basic-auth middleware). Host network mode lets Traefik reach loopback:9119.
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    network_mode: host
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/letsencrypt:/letsencrypt
      - ./config/traefik/rules:/rules
